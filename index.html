<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="3;url=https://task-manager.gssriram.workers.dev/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>This site has moved | TaskFlow Task Manager</title>
  <style>
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #07111f;
      color: #eef6ff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 1.5rem;
    }
    .card {
      background: rgba(14, 25, 43, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 2.5rem;
      max-width: 520px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(18px);
    }
    .brand-mark {
      display: inline-grid;
      place-items: center;
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: linear-gradient(135deg, #35d0ba, #6ea8ff);
      color: #04111d;
      font-weight: 800;
      font-size: 1.35rem;
      margin-bottom: 1.25rem;
    }
    h1 {
      color: #35d0ba;
      font-size: 1.85rem;
      margin-top: 0;
      margin-bottom: 1rem;
      font-weight: 700;
    }
    p {
      color: #91a3bb;
      line-height: 1.6;
      margin-bottom: 1.25rem;
      font-size: 1rem;
    }
    .timer-text {
      color: #ffd166;
      font-weight: 600;
      font-size: 1.05rem;
      margin-bottom: 1.85rem;
    }
    #countdown {
      font-size: 1.3rem;
      color: #35d0ba;
      font-weight: 700;
    }
    a.btn {
      display: inline-block;
      background: linear-gradient(135deg, #35d0ba, #6ea8ff);
      color: #07111f;
      font-weight: 700;
      padding: 0.95rem 2.2rem;
      border-radius: 30px;
      text-decoration: none;
      font-size: 1.05rem;
      transition: transform 0.2s, opacity 0.2s;
      box-shadow: 0 10px 25px rgba(53, 208, 186, 0.25);
    }
    a.btn:hover {
      opacity: 0.92;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand-mark">TF</div>
    <h1>This site has moved</h1>
    <p>
      TaskFlow has been upgraded to a full-stack web application powered by Node.js, Express, PostgreSQL database, and Cloudflare Workers.
    </p>
    <div class="timer-text">
      Redirecting automatically in <span id="countdown">3</span> seconds...
    </div>
    <a href="https://task-manager.gssriram.workers.dev/" class="btn">Go to the new task manager</a>
  </div>

  <script>
    if (window.location.hostname !== 'task-manager.gssriram.workers.dev') {
      let secondsLeft = 3;
      const countdownEl = document.getElementById('countdown');
      const timer = setInterval(function() {
        secondsLeft--;
        if (countdownEl) {
          countdownEl.textContent = secondsLeft;
        }
        if (secondsLeft <= 0) {
          clearInterval(timer);
          window.location.href = "https://task-manager.gssriram.workers.dev/";
        }
      }, 1000);
    }
  </script>
</body>
</html>
